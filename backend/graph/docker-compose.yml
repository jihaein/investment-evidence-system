services:
  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474"   # Browser: http://localhost:7474
      - "7687:7687"   # Bolt
    environment:
      # 저장소 맨 위에서: docker compose --env-file .env -f backend/graph/docker-compose.yml up -d
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      # apoc: 화면용 가상 관계 / genai: Browser 쿼리 안에서 OpenAI 임베딩 호출(genai.vector.encode)
      NEO4J_PLUGINS: '["apoc", "genai"]'
    volumes:
      - fds_neo4j_data:/data

volumes:
  fds_neo4j_data:
