# Daily health check of the chain (ops/live/health_check.py): our DB, the UI tables and the two workflows' recent runs.
# A failed run e-mails the repo owner (Settings → Notifications → Actions → failed workflows).
# Started by Supabase pg_cron through workflow_dispatch (ops/cloud/github_cron.sql): 10:50 KST every day.
name: health-check

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul
      MARKET_CALENDAR_CSV: ${{ github.workspace }}/ops/live/krx_sessions.csv
      MARKET_READY_AFTER_KST: "19:00"
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      UI_SUPABASE_URL: ${{ secrets.UI_SUPABASE_URL }}
      UI_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.UI_SUPABASE_SERVICE_ROLE_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Trim secrets
        run: |
          for name in SUPABASE_DB_URL UI_SUPABASE_URL UI_SUPABASE_SERVICE_ROLE_KEY; do
            value="$(printenv "$name" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            if [ -z "$value" ]; then echo "::error::Secret $name is missing"; exit 1; fi
            { echo "$name<<__END__"; echo "$value"; echo "__END__"; } >> "$GITHUB_ENV"
          done

      - name: Check the chain
        run: python -u ops/live/health_check.py
