# Rebuttal analysis of the UI's 보리 conversations (ops/ui/analysis_worker.py, 윤정민's S3-S9 pipeline).
#
# Setup (once): secrets UI_SUPABASE_URL, UI_SUPABASE_SERVICE_ROLE_KEY, OPENAI_API_KEY (plus the cloud-storage
# secrets SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY already used by daily-refresh); run ops/ui/sql/analysis_results.sql
# in the UI project; then set the repository variable ANALYSIS_SCHEDULE_ENABLED = true.
# Every 30 minutes it refreshes the gardens' 서서히 verdicts and analyses the packets that arrived since the last run. Manual run: Actions → analysis-worker.
name: analysis-worker

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: analysis-worker
  cancel-in-progress: false

jobs:
  analyse:
    if: github.event_name == 'workflow_dispatch' || vars.ANALYSIS_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Seoul
      REBUTTAL_S3_DIR: /home/runner/rebuttal-s3
      CLOUD_BUCKET: ies-data
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      UI_SUPABASE_URL: ${{ secrets.UI_SUPABASE_URL }}
      UI_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.UI_SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4      # Git LFS files are not downloaded; the S3 files come from cloud storage

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Trim secrets
        run: |
          for name in SUPABASE_DB_URL SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY UI_SUPABASE_URL UI_SUPABASE_SERVICE_ROLE_KEY OPENAI_API_KEY; do
            value="$(printenv "$name" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            if [ -z "$value" ]; then echo "::error::Secret $name is missing"; exit 1; fi
            { echo "$name<<__END__"; echo "$value"; echo "__END__"; } >> "$GITHUB_ENV"
          done

      - name: Restore S3 company arguments
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/rebuttal-s3
          key: rebuttal-s3-${{ github.run_id }}
          restore-keys: rebuttal-s3-

      # --overwrite: a regenerated file keeps its name (fact_registry.json), so compare contents, not names
      - name: Bring S3 files up to date from cloud storage
        id: s3
        run: |
          python ops/cloud/sync.py pull --overwrite --only rebuttal_s3 | tee pull.log
          if grep -qE ", [1-9][0-9,]* restored" pull.log; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Keep S3 copy (only when it changed)
        if: steps.s3.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/rebuttal-s3
          key: rebuttal-s3-${{ github.run_id }}

      # a stock planted since the last daily refresh gets its 서서히 verdict within 30 minutes
      - name: 서서히 verdicts for the gardens
        run: python -u ops/ui/push_signals.py

      - name: Analyse pending packets
        run: python -u ops/ui/analysis_worker.py
